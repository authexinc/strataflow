; StrataFlow (Odoo 19) — installed to /etc/strataflow/odoo.conf by scripts/vps_bootstrap.sh,
; which replaces __ADMIN_PASSWD__. Edit on the server; this copy is the template.
[options]
addons_path = /opt/strataflow/addons
data_dir = /var/lib/strataflow
logfile = /var/log/strataflow/odoo.log
log_level = warn

; postgres over the unix socket, peer-authenticated as the strataflow user
db_host = False
db_port = False
db_user = strataflow
db_password = False
db_name = strataflow
dbfilter = ^strataflow$
list_db = False
admin_passwd = __ADMIN_PASSWD__

; behind nginx (deploy/nginx/flow.strataline.co)
proxy_mode = True
http_interface = 127.0.0.1
http_port = 8069
gevent_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200
